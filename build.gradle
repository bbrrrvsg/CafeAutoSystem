plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

// =====================================================================
// 빌드 컴파일 단계에서 webapp 파편을 JAR 표준 리소스 탐색 경로로 직접 강제 이주
// =====================================================================
processResources {
	from('src/main/webapp') {
		include '**/*'
		into 'META-INF/resources'
	}
}

repositories {
	mavenCentral()
	maven { url 'https://repo.spring.io/milestone' }
}

// =====================================================================
// 의존성 버전 관리 (한 블록으로 통합)
//  - Spring AI BOM import
//  - AWS SDK 버전 고정 (Spring Boot BOM이 덮어쓰지 않도록)
// =====================================================================
dependencyManagement {
	imports {
		mavenBom 'org.springframework.ai:spring-ai-bom:2.0.0'
	}
	dependencies {
		dependency 'software.amazon.awssdk:s3:2.25.60'
		dependency 'software.amazon.awssdk:sts:2.25.60'
		dependency 'software.amazon.awssdk:url-connection-client:2.25.60'
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'

	// QR 코드 생성
	implementation 'com.google.zxing:core:3.5.3'
	implementation 'com.google.zxing:javase:3.5.3'

	// JSP 지원
	implementation 'org.apache.tomcat.embed:tomcat-embed-jasper'
	implementation 'jakarta.servlet:jakarta.servlet-api'
	implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api'
	implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl'

	// 개발용 핫리로드 (서버 자동 재시작 + LiveReload)
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// JavaMailSender를 사용하기 위한 스프링 메일 스타터 부품
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	// 엑셀 파일 생성을 위한 Apache POI 핵심 라이브러리
	implementation 'org.apache.poi:poi:5.2.5'
	// .xlsx 확장자를 다루기 위한 POI XML 확장 라이브러리 (XSSFWorkbook용)
	implementation 'org.apache.poi:poi-ooxml:5.2.5'
	// 스프링 카프카 라이브러리 추가
	implementation 'org.springframework.kafka:spring-kafka'

	// WebClient (Ollama LLM / 파이썬 예측서버 등 외부 API 호출용)
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	// AWS S3 연동 (SDK v2 직접 버전 명시 - Spring Boot 4.x 호환)
	implementation 'software.amazon.awssdk:s3:2.25.60'
	implementation 'software.amazon.awssdk:sts:2.25.60'
	implementation 'software.amazon.awssdk:url-connection-client:2.25.60'

	// Spring AI - Ollama (ChatClient + tool calling). Spring Boot 4 → Spring AI 2.0
	implementation 'org.springframework.ai:spring-ai-starter-model-ollama'
}

tasks.named('test') {
	useJUnitPlatform()
}
