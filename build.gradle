plugins {
	id 'java'
	id 'war' // 1. WAR 플러그인을 반드시 추가해 주세요!
	id 'org.springframework.boot' version '4.0.6' // 프로젝트 버전에 맞게 유지
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Spring Boot Starters (명칭 교정)
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web' // webmvc -> web으로 변경
	implementation 'org.springframework.boot:spring-boot-starter-mail'

	// QR 코드 생성
	implementation 'com.google.zxing:core:3.5.3'
	implementation 'com.google.zxing:javase:3.5.3'

	// JSP 및 JSTL 지원
	// AWS EB/외장 톰캣 배포 시 충돌 방지를 위해 providedRuntime으로 설정
	providedRuntime 'org.apache.tomcat.embed:tomcat-embed-jasper'
	implementation 'jakarta.servlet:jakarta.servlet-api'
	implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api'
	implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl'

	// 엑셀 파일 생성 (Apache POI)
	implementation 'org.apache.poi:poi:5.2.5'
	implementation 'org.apache.poi:poi-ooxml:5.2.5'

	// 개발용 핫리로드
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// Lombok 설정
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'

	// 테스트 의존성 정돈 (부프트 표준 starter-test 하나로 jpa, web 테스트 통합 지원)
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	// JavaMailSender를 사용하기 위한 스프링 메일 스타터 부품
    implementation 'org.springframework.boot:spring-boot-starter-mail'
	// 엑셀 파일 생성을 위한 Apache POI 핵심 라이브러리
	implementation 'org.apache.poi:poi:5.2.5'
	// .xlsx 확장자를 다루기 위한 POI XML 확장 라이브러리 (XSSFWorkbook용)
	implementation 'org.apache.poi:poi-ooxml:5.2.5'
	// 스프링 카프카 라이브러리 추가
	implementation 'org.springframework.kafka:spring-kafka'

	// WebClient (Ollama LLM / 파이썬 예측서버 등 외부 API 호출용)
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
