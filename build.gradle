plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
	maven { url 'https://repo.spring.io/milestone' }
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'

	// QR 코드 생성
	implementation 'com.google.zxing:core:3.5.3'
	implementation 'com.google.zxing:javase:3.5.3'

	// JSP 지원
	implementation 'org.apache.tomcat.embed:tomcat-embed-jasper'
	implementation 'jakarta.servlet:jakarta.servlet-api'
	implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api'
	implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl'

	// 개발용 핫리로드 (서버 자동 재시작 + LiveReload)
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	// JavaMailSender를 사용하기 위한 스프링 메일 스타터 부품
    implementation 'org.springframework.boot:spring-boot-starter-mail'
	// 엑셀 파일 생성을 위한 Apache POI 핵심 라이브러리
	implementation 'org.apache.poi:poi:5.2.5'
	// .xlsx 확장자를 다루기 위한 POI XML 확장 라이브러리 (XSSFWorkbook용)
	implementation 'org.apache.poi:poi-ooxml:5.2.5'
	// 스프링 카프카 라이브러리 추가
	implementation 'org.springframework.kafka:spring-kafka'

	// Spring AI
	implementation platform("org.springframework.ai:spring-ai-bom:2.0.0-RC1")
	implementation "org.springframework.ai:spring-ai-starter-model-openai"


}

tasks.named('test') {
	useJUnitPlatform()
}
